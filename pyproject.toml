[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-drill-platform"
version = "0.1.0"
description = "系统故障演练平台：实验场景、故障注入与观察记录"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chaos = "chaos_platform.cli:main"

[tool.setuptools]
packages = ["chaos_platform", "chaos_platform.faults"]
